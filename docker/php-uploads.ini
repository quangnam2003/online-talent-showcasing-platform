; TalentStage — gioi han upload cho FR2 (dang video / am thanh toi da 100 MB).
; Anh php:8.3-apache mac dinh chi cho 2M/8M → moi tep lon deu bi tu choi
; ("The video failed to upload" hoac loi 413). File nay duoc COPY vao
; /usr/local/etc/php/conf.d/ trong Dockerfile.
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 20
max_input_time = 600
max_execution_time = 300
memory_limit = 256M
